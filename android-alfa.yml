# VetTEX Alfa (V1.0G) — alfa test sürümü derleme hattı
# Actions sekmesi → "Android build — Alfa" → Run workflow.
# Asıl uygulamadan AYRI bir uygulamadır (com.vettex.alfa): aynı telefonda ikisi birlikte kurulu olabilir.
#   • Açılışta kullanıcı adı + şifre ister (hesaplar Supabase → Authentication → Users'ta açılır)
#   • Girişten sonra tüm vakalar açık (VIP); giriş ekranındaki "Demo vakalar" ile hesapsız 3 demo vaka
#   • Vakalar APK'nın içinde; Supabase'e vaka yüklemez
# Çıktı: imzalı APK (testçilere gönderilir) + AAB (istersen Play iç testine).
# Gerekli gizli değerler: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (asıl uygulamayla aynı)

name: Android build — Alfa

on:
  workflow_dispatch:

env:
  APP_ID: com.vettex.alfa       # asıl uygulamadan (com.vettex.app) ayrı
  APP_NAME: VetTEX Alfa
  MIN_SDK_TARGET: 36

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Repoyu al
        uses: actions/checkout@v5

      - name: Gizli değerleri kontrol et
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Eksik gizli değer(ler):$missing — Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (makinede hazır olanı kullan)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then echo "::error::Makinede Android SDK bulunamadı"; exit 1; fi
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "platform-tools" || echo "::warning::SDK paketi kurulamadı, Gradle kendisi indirmeyi deneyecek"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Oyun dosyalarını hazırla (www) + görselleri ve sesleri göm
        run: |
          python3 - <<'PY'
          import os, re, glob, shutil, hashlib, urllib.request, urllib.parse

          RAW = 'https://raw.githubusercontent.com/ArdaGumush/Vettextasima/refs/heads/main/'
          os.makedirs('www/media', exist_ok=True)

          # 1) Oyun sayfası + tutorial + veri dosyaları
          #    Repodaki oyun dosyası: VetTEX_Genel_Kullanım.html (eski VetCaseClaudeKontrol*.html dosyaları KOPYALANMAZ)
          #    APK'nın içinde Türkçe karaktersiz adla durur: VetTEX_Genel_Kullanim.html
          GAME_SRC, GAME = 'VetTEX_Genel_Kullanım.html', 'VetTEX_Genel_Kullanim.html'
          if not os.path.exists(GAME_SRC):
              alt = [f for f in glob.glob('VetTEX_Genel_Kullan*.html')]
              if not alt:
                  raise SystemExit(GAME_SRC + ' repoda bulunamadı (dosya adını kontrol et)')
              GAME_SRC = alt[0]
          skip = {'package.json', 'package-lock.json', 'capacitor.config.json'}
          copies = {GAME_SRC: GAME}
          if os.path.exists('VettexTutorial.html'):
              copies['VettexTutorial.html'] = 'VettexTutorial.html'
          for f in glob.glob('*.json'):
              if f not in skip:
                  copies[f] = f
          for s, d in copies.items():
              shutil.copy(s, os.path.join('www', d))
          files = sorted(copies.values())
          print('Kopyalanan dosyalar:', ', '.join(files))
          # Sayfalar birbirine Türkçe karakterli adla bakıyor → APK içindeki ASCII ada çevir
          for f in files:
              if f.endswith('.html'):
                  p = os.path.join('www', f)
                  s = open(p, encoding='utf-8').read()
                  s2 = s.replace('VetTEX_Genel_Kullanım.html', GAME).replace('VetTEX_Genel_Kullan%C4%B1m.html', GAME)
                  if s2 != s:
                      open(p, 'w', encoding='utf-8').write(s2)

          # Uygulama oyun sayfasıyla açılır (ilk açılışta oyun tutorial'a yönlendirir)
          with open('www/index.html', 'w', encoding='utf-8') as fh:
              fh.write('<!doctype html><meta charset="utf-8"><script>location.replace("' + GAME + '")</script>')

          # 2) İnternetten gelen görsel/sesleri indirip APK'ya göm
          media_re = re.compile(r'https?://[^\s"\'<>\\?#]+?\.(?:png|jpe?g|webp|gif|svg|mp3|ogg|wav|m4a)(?![\w/.\-])(?:\?[^\s"\'<>()\\]*)?', re.I)
          texts = {}
          for f in files:
              with open(os.path.join('www', f), encoding='utf-8') as fh:
                  texts[f] = fh.read()
          urls = sorted({u for t in texts.values() for u in media_re.findall(t)})
          ok, fail, mapping = 0, [], {}
          for u in urls:
              ext = os.path.splitext(urllib.parse.urlparse(u).path)[1].lower() or '.bin'
              name = 'media/' + hashlib.md5(u.encode()).hexdigest()[:12] + ext
              dest = os.path.join('www', name)
              local = urllib.parse.unquote(u[len(RAW):]) if u.startswith(RAW) else None
              try:
                  if local and os.path.exists(local):
                      shutil.copy(local, dest)
                  else:
                      req = urllib.request.Request(u, headers={'User-Agent': 'VetTEX-build/1.0 (vettex.app@gmail.com)'})
                      last = None
                      for _ in range(3):
                          try:
                              with urllib.request.urlopen(req, timeout=40) as r, open(dest, 'wb') as out:
                                  out.write(r.read())
                              last = None
                              break
                          except Exception as e:
                              last = e
                      if last:
                          raise last
                  mapping[u] = name
                  ok += 1
              except Exception as e:
                  fail.append((u, str(e)))
          for f, t in texts.items():
              for u, name in mapping.items():
                  t = t.replace(u, name)
              # 3) Veri dosyaları artık APK'nın içinden okunur
              t = t.replace(RAW, '')
              with open(os.path.join('www', f), 'w', encoding='utf-8') as fh:
                  fh.write(t)
          print(f'Gömülen medya: {ok}/{len(urls)}')
          for u, e in fail:
              print(f'::warning::İndirilemedi, internetten yüklenmeye devam edecek: {u} ({e})')
          PY

      - name: Alfa modunu aç (giriş ekranı + tüm vakalar açık)
        run: |
          python3 - <<'PY'
          p = 'www/VetTEX_Genel_Kullanim.html'
          t = open(p, encoding='utf-8').read()
          if '<head>' not in t: raise SystemExit('<head> bulunamadı')
          t = t.replace('<head>', '<head>\n<script>window.VETTEX_ALPHA = true;</script>', 1)
          open(p, 'w', encoding='utf-8').write(t)
          print('Alfa modu açıldı')
          PY

      - name: Capacitor projesini oluştur
        run: |
          cat > package.json <<'JSON'
          { "name": "vettex-alfa", "version": "1.0.0", "private": true }
          JSON
          cat > capacitor.config.json <<JSON
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "force" }
          }
          JSON
          npm install @capacitor/core@latest @capacitor/android@latest @capacitor/app@latest @capacitor/cli@latest
          npx cap --version
          npx cap add android

      - name: Android ayarları (API 36, sürüm numarası)
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          n = int(os.environ['RUN_NO'])
          want = int(os.environ['MIN_SDK_TARGET'])
          v = 'android/variables.gradle'
          t = open(v).read()
          for key in ('compileSdkVersion', 'targetSdkVersion'):
              m = re.search(key + r'\s*=\s*(\d+)', t)
              if m and int(m.group(1)) < want:
                  t = t.replace(m.group(0), f'{key} = {want}')
          open(v, 'w').write(t)
          b = 'android/app/build.gradle'
          t = open(b).read()
          t = re.sub(r'versionCode\s+\d+', f'versionCode {n}', t)
          t = re.sub(r'versionName\s+"[^"]*"', f'versionName "alfa-1.0G.{n}"', t)
          open(b, 'w').write(t)
          print(open(v).read())
          print('versionCode', n, '/ versionName alfa-1.0G.' + str(n))
          PY
          npx cap sync android

      - name: Uygulama ikonu
        # Repoda vettex-icon.png (+ isteğe bağlı -foreground / -background) varsa tüm boyutlar üretilir.
        # İkon üretilemezse derleme durmaz, Capacitor'ın varsayılan ikonuyla devam eder.
        continue-on-error: true
        run: |
          if [ ! -f vettex-icon.png ]; then echo "vettex-icon.png yok, varsayılan ikon kullanılacak"; exit 0; fi
          mkdir -p assets
          cp vettex-icon.png assets/icon-only.png
          [ -f vettex-icon-foreground.png ] && cp vettex-icon-foreground.png assets/icon-foreground.png
          [ -f vettex-icon-background.png ] && cp vettex-icon-background.png assets/icon-background.png
          npx --yes @capacitor/assets@latest generate --android --assetPath assets --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: İmzalı AAB ve APK derle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cd ..
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab "out/VetTEX-Alfa-1.0G-${{ github.run_number }}.aab"
          cp android/app/build/outputs/apk/release/*.apk "out/VetTEX-Alfa-1.0G-${{ github.run_number }}.apk"
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -la out

      - name: Dosyaları indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: VetTEX-Alfa-1.0G-${{ github.run_number }}
          path: out/
          retention-days: 30
