<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vettex Tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --shade: rgba(4, 8, 18, 0.72);
    --panel: #0f1626;
    --line: rgba(0, 212, 255, 0.28);
    --cyan: #00d4ff;
    --text: #e8eef6;
    --muted: #8a9bb3;
    --green: #2ecc71;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e1a; }
  body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--text); }

  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Gölge katmanı: spotlight deliğinin etrafındaki dört parça.
     Delik açık kalır, böylece sadece parlayan alana dokunulabilir. */
  #tut-layer { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #tut-layer.on .shade { pointer-events: auto; }
  .shade { position: fixed; background: var(--shade); transition: opacity .25s; }
  #tut-layer:not(.on) .shade { opacity: 0; }

  #ring {
    position: fixed; border-radius: 12px; pointer-events: none;
    box-shadow: 0 0 0 2px var(--cyan), 0 0 22px 4px rgba(0, 212, 255, 0.45);
    opacity: 0; transition: opacity .2s;
  }
  #ring.show { opacity: 1; animation: ringPulse 1.6s ease-in-out infinite; }
  #ring.block { pointer-events: auto; }
  #ring.flash { animation: ringFlash .45s ease-out; }
  @keyframes ringPulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--cyan), 0 0 18px 3px rgba(0,212,255,.35); }
    50%      { box-shadow: 0 0 0 3px var(--cyan), 0 0 32px 8px rgba(0,212,255,.6); }
  }
  @keyframes ringFlash {
    0% { box-shadow: 0 0 0 6px #fff, 0 0 40px 12px rgba(0,212,255,.9); }
    100% { box-shadow: 0 0 0 2px var(--cyan), 0 0 22px 4px rgba(0,212,255,.45); }
  }

  /* Rehber kartı */
  #card {
    position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
    width: min(440px, calc(100vw - 24px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.55);
    opacity: 0; transition: opacity .2s, top .3s ease, bottom .3s ease;
    pointer-events: auto;
  }
  #card.show { opacity: 1; }
  #card.at-bottom { bottom: max(14px, env(safe-area-inset-bottom)); top: auto; }
  #card.at-top { top: max(14px, env(safe-area-inset-top)); bottom: auto; }
  #card.shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(-50%); }
    25% { transform: translateX(calc(-50% - 6px)); }
    75% { transform: translateX(calc(-50% + 6px)); }
  }

  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  #chapter { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px; color: var(--cyan); letter-spacing: .3px; }
  #skip {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px;
    cursor: pointer; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px;
  }
  #progress { height: 3px; background: rgba(255,255,255,.07); border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
  #progress-fill { height: 100%; width: 0; background: var(--cyan); transition: width .35s ease; }
  #text { font-size: 15px; line-height: 1.6; max-width: 62ch; }
  #text strong { color: #fff; font-weight: 600; }
  #text .quote { display: block; margin-top: 8px; padding: 8px 10px; border-left: 2px solid var(--green); background: rgba(46,204,113,.06); border-radius: 0 6px 6px 0; font-size: 14px; color: #cfe9da; }

  .actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 14px; min-height: 36px; }
  #hint { margin-right: auto; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  #hint .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); animation: dotPulse 1.2s infinite; }
  @keyframes dotPulse { 50% { opacity: .3; } }
  .btn {
    font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 9px 18px; cursor: pointer;
    border: 1px solid var(--cyan); background: rgba(0,212,255,.12); color: var(--cyan);
  }
  .btn:hover { background: rgba(0,212,255,.2); }
  .btn.ghost { border-color: rgba(255,255,255,.18); background: transparent; color: var(--muted); font-weight: 500; }
  .btn.primary { background: var(--cyan); color: #04121a; }
  .btn:focus-visible, #skip:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Bitiş ekranı */
  #finish {
    position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    background: rgba(4, 8, 18, .85); padding: 20px;
  }
  #finish.show { display: flex; }
  .finish-box { width: min(400px, 100%); text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px 22px; }
  .finish-box h2 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; margin: 6px 0 8px; color: #fff; }
  .finish-box p { color: var(--muted); line-height: 1.6; margin: 0 0 20px; font-size: 14.5px; }
  .finish-box .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .paw { font-size: 40px; }

  @media (prefers-reduced-motion: reduce) {
    #ring.show, #hint .dot { animation: none; }
    #card, #progress-fill { transition: none; }
  }
</style>
</head>
<body>

<iframe id="app" src="VetCaseClaudeKontrol.html" title="Vettex"></iframe>

<div id="tut-layer">
  <div class="shade" id="sh-top"></div>
  <div class="shade" id="sh-bottom"></div>
  <div class="shade" id="sh-left"></div>
  <div class="shade" id="sh-right"></div>
  <div id="ring"></div>
</div>

<div id="card" class="at-bottom" role="dialog" aria-live="polite">
  <div class="card-head">
    <div id="chapter">Hazırlanıyor</div>
    <button id="skip" type="button">Tutorial'ı atla</button>
  </div>
  <div id="progress"><div id="progress-fill"></div></div>
  <div id="text">Klinik hazırlanıyor…</div>
  <div class="actions">
    <div id="hint" class="hidden"><span class="dot"></span><span id="hint-text">Parlayan alana dokun</span></div>
    <button id="btn-pass" class="btn ghost hidden" type="button">Bu adımı geç</button>
    <button id="btn-next" class="btn hidden" type="button">Devam</button>
  </div>
</div>

<div id="finish">
  <div class="finish-box">
    <div class="paw">🐾</div>
    <h2>İlk vakan tamam!</h2>
    <p>Vettex'in temel akışını gördün: genel bilgiler, anamnez, görüntüleme ve teşhis. Artık kendi vakalarını çözmeye hazırsın.</p>
    <div class="row">
      <button class="btn ghost" id="btn-replay" type="button">Tekrar izle</button>
      <button class="btn primary" id="btn-enter" type="button">Kliniğe gir</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// YARDIMCILAR
// Ana oyundaki CASE_DATA, currentCase gibi değişkenler `let` ile
// tanımlı, window üzerinden görünmezler. Bu yüzden iframe'in kendi
// global kapsamında eval ile okuyup yazıyoruz (aynı origin gerekir).
// ═══════════════════════════════════════════════════════════════
const frame = document.getElementById('app');
const W = () => frame.contentWindow;
const D = () => frame.contentDocument;
function ev(code) { try { return W().eval(code); } catch (e) { console.warn('[Tutorial] eval hatası:', code, e.message); return undefined; } }
function q(sel)  { try { return D().querySelector(sel); } catch (e) { return null; } }
function shown(el) {
  if (!el || !el.isConnected) return false;
  const r = el.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return false;
  const cs = W().getComputedStyle(el);
  return cs.visibility !== 'hidden' && cs.display !== 'none' && parseFloat(cs.opacity) > 0.05;
}
const log = (...a) => console.log('%c[VettexTutorial]', 'color:#00d4ff;font-weight:bold', ...a);

// Tutorial vakası ve teşhisi
const TUT_CASE = 'cat';   // Luna — Yabancı Cisim Obstrüksiyonu (GIS)
const TUT_COMPLAINT = 'Sahibi endişeli bir ifadeyle anlatıyor:\n\n"3 gündür hiçbir şey yemiyor, su bile içmek istemiyor. Bir de sürekli kusuyor, ama karnında hiçbir şey yok gibi — sadece sarı sıvı geliyor."';
const GIS_NAME = 'Yabancı Cisim Obstrüksiyonu (GIS)';
function gisId() { return ev(`(DISEASE_LIBRARY.find(d => d.name === ${JSON.stringify(GIS_NAME)}) || {}).id`) || 't02'; }

// ═══════════════════════════════════════════════════════════════
// ADIMLAR
// mode:
//   'click'        → parlayan alana dokununca ilerler
//   'next'         → okuma adımı, Devam ile ilerler (alan tıklanamaz)
//   'interactive'  → alan kullanılabilir, Devam ile ilerler
// fallback: takılırsa "Bu adımı geç" ile çalışacak eylem
// ═══════════════════════════════════════════════════════════════
const STEPS = [
  // ── AYARLAR ──
  { ch: 'Hoş geldin', mode: 'click',
    text: `<strong>Vettex Dijital Eğitici Veteriner Klinik Simülasyonu'na hoş geldiniz!</strong><br>Ayarlarla başlayalım: parlayan <strong>Ayarlar</strong> sekmesine dokun.`,
    target: () => q(`button.wm-tab[onclick="wmTab('ayarlar')"]`),
    fallback: () => ev(`wmTab('ayarlar')`) },

  { ch: 'Ayarlar', mode: 'next',
    text: `Bazı vakalarımız <strong>acil</strong> oluyor. Bu vakalarda klinikteki aceleyi yansıtabilmek için sana <strong>5 eylem hakkı</strong> veriliyor; anamnezden teşhise en hızlı yoldan ilerlemen gerekiyor.`,
    target: () => q('#settings-emergency-toggle')?.closest('.settings-row') },

  { ch: 'Ayarlar', mode: 'next',
    text: `<strong>Mobil Mod</strong>, mobil kullanıcılarımızın uygulamayı daha rahat kullanabilmesi için var.`,
    target: () => q('#settings-mobile-toggle')?.closest('.settings-row') },

  { ch: 'Ayarlar', mode: 'next',
    text: `<strong>Ekonomi Modu</strong>'nda hasta sahibine bir bütçe atanır ve ona göre hareket edersin. Hasta sahibinin maddi durumu düşükse pahalı testler yapılamaz; elindeki imkânlarla teşhise ulaşman beklenir.`,
    target: () => q('#settings-economy-toggle')?.closest('.settings-row') },

  { ch: 'Ayarlar', mode: 'next',
    text: `<strong>Aydınlık Mod</strong> ile açık temaya geçebilirsin.<br><br>Ayarlarımız şimdilik bu kadar. Şimdi kliniğimize girebiliriz!`,
    target: () => q('#settings-lightmode-toggle')?.closest('.settings-row') },

  // ── KLİNİĞE GİRİŞ ──
  { ch: 'Kliniğe giriş', mode: 'click',
    text: `<strong>Başlat</strong> sekmesine dokun.`,
    target: () => q(`button.wm-tab[onclick="wmTab('basla')"]`),
    fallback: () => ev(`wmTab('basla')`) },

  { ch: 'Kliniğe giriş', mode: 'click',
    text: `<strong>Klinik Mod</strong>'u seç. Burada vakalar hastalık adı gösterilmeden gelir, teşhisi sen koyarsın.`,
    enter: () => ev(`if (typeof wmHideNormal === 'function') wmHideNormal();`),
    target: () => q(`#wm-mod-cards [onclick="openClinicMode()"]`),
    fallback: () => ev(`openClinicMode()`) },

  { ch: 'Kliniğe giriş', mode: 'click', delay: 700,
    text: `<strong>Karışık</strong>'a dokun, bakalım kliniğe kim gelmiş.`,
    enter: () => armCase(),
    target: () => q(`#welcome-clinic [onclick="startClinicMode('any')"]`),
    fallback: () => { armCase(); ev(`startClinicMode('any')`); } },

  // ── GENEL BİLGİLER ──
  { ch: 'Genel bilgiler', mode: 'click',
    text: `<strong>Kliniğe hoş geldin!</strong> Şu an kliniğimizde bir kedi bulunuyor. Hadi genel bilgilerini alarak başlayalım: <strong>İsim & Irk</strong>.`,
    enter: () => ensureCase(),
    target: () => q('#btn-name'),
    fallback: () => ev(`askAnamnez('name')`) },

  { ch: 'Genel bilgiler', mode: 'click',
    text: `Şimdi <strong>Yaş / Cinsiyet / Kısırlık</strong>.`,
    target: () => q('#btn-demog'),
    fallback: () => ev(`askAnamnez('demog')`) },

  { ch: 'Genel bilgiler', mode: 'click',
    text: `<strong>Aşı & Parazit İlacı Durumu</strong>.`,
    target: () => q('#btn-vaccine'),
    fallback: () => ev(`askAnamnez('vaccine')`) },

  { ch: 'Genel bilgiler', mode: 'click',
    text: `Son olarak <strong>Şikayet</strong>: hasta sahibi neden geldiğini anlatsın.`,
    enter: () => setComplaint(),
    target: () => q('#btn-complaint'),
    fallback: () => { setComplaint(); ev(`askAnamnez('complaint')`); } },

  { ch: 'Genel bilgiler', mode: 'next',
    text: `Yeme içme yok, kusuyor ama gıda içeriği de gelmiyor. Hadi anamnezi derinleştirelim.`,
    target: () => q('#monitor-output')?.lastElementChild },

  // ── ANAMNEZ ──
  { ch: 'Anamnez', mode: 'click',
    text: `<strong>Anamnez Sor</strong>'a dokun.`,
    target: () => q(`#center-panel button[onclick="openAnamnezModal()"]`),
    fallback: () => ev(`openAnamnezModal()`) },

  { ch: 'Anamnez', mode: 'click',
    text: `Burada istediğin sistemden istediğin soruyu sorabilirsin. Şimdilik gıda ve su alımı olmadığı için, GIS obstrüksiyon şüphesiyle yabancı cisimlerle oynama ve yutma huyu var mı, onu soralım.<br><br>Önce <strong>Genel Durum</strong>'u aç.`,
    target: () => q(`#anamnez-modal-body .aq-cat-header[onclick*="'genel'"]`),
    fallback: () => ev(`toggleAqCat('genel')`) },

  { ch: 'Anamnez', mode: 'click',
    text: `Sonra <strong>Davranış</strong>.`,
    target: () => q(`#anamnez-modal-body .aq-sub-header[onclick*="'davranis'"]`),
    fallback: () => ev(`document.getElementById('aqsub_genel').style.display='block'; toggleAqSub('davranis')`) },

  { ch: 'Anamnez', mode: 'click',
    text: `Yabancı cisimlerle ilgili soruyu sor.`,
    target: () => q(`#anamnez-modal-body .aq-q-item[onclick*="'davranis_5'"]`),
    fallback: () => ev(`askAnamnezQ('davranis_5','genel','davranis')`) },

  { ch: 'Anamnez', mode: 'next',
    text: `Cevap şüphemizi güçlendiriyor: kedimiz yabancı cisimlerle oynamayı seviyor ve zaman zaman yutabiliyor.`,
    target: () => q('#aqans_davranis_5'),
    leave: () => ev(`closeAnamnezModal()`) },

  // ── RÖNTGEN ──
  { ch: 'Görüntüleme', mode: 'click',
    text: `Artık GIS obstrüksiyon teşhisinden kesin emin olmak için bir de röntgene bakalım. Klinik İşlemler'den <strong>Görüntüleme</strong>'ye geç.`,
    enter: () => ev(`closeAnamnezModal()`),
    target: () => q(`#center-panel .tab-btn[onclick="switchTab('goruntu')"]`),
    fallback: () => ev(`switchTab('goruntu')`) },

  { ch: 'Görüntüleme', mode: 'click',
    text: `<strong>Röntgen</strong>'e dokun.`,
    target: () => q('#ex-xray'),
    fallback: () => ev(`openXrayMenu()`) },

  { ch: 'Görüntüleme', mode: 'click', delay: 600,
    text: `<strong>İndirekt Röntgen</strong>'i seç.`,
    target: () => q(`#modal-content button[onclick*="xray_indirect"]`),
    fallback: () => ev(`closeModal(); doImaging('xray_indirect')`) },

  { ch: 'Görüntüleme', mode: 'interactive',
    text: `Görüldüğü gibi burada tıkanıklık belli oluyor.`,
    target: () => q('#modal-content .xray-container') },

  { ch: 'Görüntüleme', mode: 'interactive',
    text: `Alttaki çubuktan kontrastı ayarlayabilir, parmaklarını kullanarak yakınlaşıp uzaklaştırabilirsin. İstersen şimdi dene.`,
    target: () => q('#modal-content .xray-controls') },

  { ch: 'Görüntüleme', mode: 'interactive',
    text: `Alttaki <strong>kilit</strong> simgesine dokunarak doğrudan yorumu öğrenebilirsin.`,
    target: () => q('#interp-lock-xray_indirect'),
    leave: () => ev(`closeModal()`) },

  // ── TEŞHİS ──
  { ch: 'Teşhis', mode: 'click',
    text: `Artık teşhisimizi koymaya hazırız! <strong>Teşhis Ver</strong>'e dokun.`,
    enter: () => ev(`closeModal()`),
    target: () => q('#clinic-badge'),
    fallback: () => ev(`showDiagnosisPanel()`) },

  { ch: 'Teşhis', mode: 'click', delay: 600,
    text: `<strong>${GIS_NAME}</strong>'u seç.`,
    target: () => q(`#modal-content [onclick="submitDiagnosis('${gisId()}')"]`),
    fallback: () => ev(`submitDiagnosis('${gisId()}')`) },

  { ch: 'Teşhis', mode: 'next', last: true,
    text: `<strong>İlk vakamızı tamamladık!</strong> Burada hastalıkta görülen semptomları ve ayırıcı teşhisleri görebilirsin.`,
    target: () => (q('#result-overlay.open') ? q('#result-body') : null) },
];

// ═══════════════════════════════════════════════════════════════
// TUTORIAL VAKASI
// Oyuncu Karışık'a gerçekten dokunuyor, ama pickRandom bir kerelik
// Luna'yı (GIS) döndürecek şekilde yamalanıyor. Böylece oyunun kendi
// startClinicMode akışı aynen çalışıyor, ekran titremiyor.
// ═══════════════════════════════════════════════════════════════
function armCase() {
  ev(`
    if (!window.__tutOrigPick) {
      window.__tutOrigPick = pickRandom;
      pickRandom = function (a) {
        if (window.__tutForceKey && Array.isArray(a) && a.indexOf(window.__tutForceKey) > -1) {
          var k = window.__tutForceKey; window.__tutForceKey = null; return k;
        }
        return window.__tutOrigPick(a);
      };
    }
    window.__tutForceKey = ${JSON.stringify(TUT_CASE)};
    if (typeof clinicPlayedCases !== 'undefined') clinicPlayedCases.delete(${JSON.stringify(TUT_CASE)});
  `);
}

function ensureCase() {
  // Yama tutmadıysa (beklenmedik durum) vakayı doğrudan başlat
  const key = ev(`currentCase && currentCase._realKey`);
  if (key !== TUT_CASE) {
    log('Tutorial vakası yüklenmemiş, yeniden başlatılıyor. Mevcut:', key);
    armCase();
    ev(`document.getElementById('welcome').style.display='none'; startClinicMode('any')`);
  }
  setComplaint();
}

function setComplaint() {
  ev(`if (currentCase && currentCase.anamnez) currentCase.anamnez.complaint = [${JSON.stringify(TUT_COMPLAINT)}];`);
}

// ═══════════════════════════════════════════════════════════════
// AYARLARIN KORUNMASI
// Senaryo standart (masaüstü) ekran düzenini anlatıyor. Tutorial
// süresince mobil mod, acil mod ve ekonomi modu geçici olarak
// kapatılır; kullanıcının tercihleri localStorage'a dokunulmadan
// tutorial bitince geri yüklenir.
// ═══════════════════════════════════════════════════════════════
let saved = null;
function prepareApp() {
  saved = ev(`({ mobile: !!mobileMode, eco: !!economyMode, emerg: !!emergencyModeEnabled })`) || { mobile: false, eco: false, emerg: false };
  log('Kayıtlı ayarlar', saved);
  ev(`
    mobileMode = false; document.body.classList.remove('mobile-mode');
    economyMode = false; emergencyModeEnabled = false;
    var _w = document.getElementById('welcome'); if (_w) _w.style.cssText = '';
    var _wc = document.getElementById('welcome-clinic'); if (_wc) _wc.style.display = 'none';
  `);
}

function restoreApp() {
  if (!saved) return;
  ev(`
    if (window.__tutOrigPick) { pickRandom = window.__tutOrigPick; delete window.__tutOrigPick; }
    window.__tutForceKey = null;
    economyMode = ${saved.eco}; emergencyModeEnabled = ${saved.emerg};
    if (typeof updateCreditUI === 'function') updateCreditUI();
  `);
  if (saved.mobile) {
    ev(`
      mobileMode = true; document.body.classList.add('mobile-mode');
      var _w = document.getElementById('welcome'); if (_w) _w.style.cssText = 'display:none!important';
      if (typeof mobShowScreen === 'function') mobShowScreen('mob-home-screen');
    `);
  }
  saved = null;
}

// ═══════════════════════════════════════════════════════════════
// MOTOR
// ═══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const layer = $('tut-layer'), ring = $('ring'), card = $('card');
let idx = -1, cur = null, el = null, stepStart = 0, advancing = false, scrolledEl = null, running = false;

function go(i) {
  if (cur && cur.leave) cur.leave();
  idx = i; cur = STEPS[i]; el = null; scrolledEl = null; advancing = false; stepStart = Date.now();
  log(`Adım ${i + 1}/${STEPS.length}: ${cur.ch}`);
  $('chapter').textContent = cur.ch;
  $('text').innerHTML = cur.text;
  $('progress-fill').style.width = ((i + 1) / STEPS.length * 100) + '%';
  const reading = cur.mode !== 'click';
  $('btn-next').classList.toggle('hidden', !reading);
  $('btn-next').textContent = cur.last ? 'Bitir' : 'Devam';
  $('hint').classList.toggle('hidden', reading);
  $('hint-text').textContent = 'Parlayan alana dokun';
  $('btn-pass').classList.add('hidden');
  ring.classList.toggle('block', cur.mode === 'next');
  if (cur.enter) cur.enter();
}

function advance(delay) {
  if (advancing) return;
  advancing = true;
  setTimeout(() => {
    if (cur && cur.last) { finish(); return; }
    if (idx + 1 < STEPS.length) go(idx + 1); else finish();
  }, delay || 0);
}

function place(r) {
  const vw = innerWidth, vh = innerHeight, pad = 6;
  const st = (id, x, y, w, h) => { const s = $(id).style; s.left = x + 'px'; s.top = y + 'px'; s.width = Math.max(0, w) + 'px'; s.height = Math.max(0, h) + 'px'; };
  if (!r) {
    st('sh-top', 0, 0, vw, vh); st('sh-bottom', 0, 0, 0, 0); st('sh-left', 0, 0, 0, 0); st('sh-right', 0, 0, 0, 0);
    ring.classList.remove('show');
    card.classList.remove('at-top'); card.classList.add('at-bottom');
    return;
  }
  const x = Math.max(0, r.left - pad), y = Math.max(0, r.top - pad);
  const x2 = Math.min(vw, r.right + pad), y2 = Math.min(vh, r.bottom + pad);
  st('sh-top', 0, 0, vw, y);
  st('sh-bottom', 0, y2, vw, vh - y2);
  st('sh-left', 0, y, x, y2 - y);
  st('sh-right', x2, y, vw - x2, y2 - y);
  const rs = ring.style; rs.left = x + 'px'; rs.top = y + 'px'; rs.width = (x2 - x) + 'px'; rs.height = (y2 - y) + 'px';
  ring.classList.add('show');
  // Kartı hedefin karşı tarafına koy
  const ch = card.offsetHeight + 28;
  const spaceBelow = vh - y2, spaceAbove = y;
  const top = spaceBelow < ch && spaceAbove > spaceBelow;
  card.classList.toggle('at-top', top);
  card.classList.toggle('at-bottom', !top);
}

function tick() {
  if (running && cur) {
    let t = null;
    try { t = cur.target ? cur.target() : null; } catch (e) { t = null; }
    el = shown(t) ? t : null;
    if (el && el !== scrolledEl) {
      scrolledEl = el;
      try { el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' }); } catch (e) {}
    }
    place(el ? el.getBoundingClientRect() : null);
    // Hedef uzun süre bulunamazsa çıkış yolu göster
    const stuck = !el && Date.now() - stepStart > 7000;
    if (stuck) {
      $('btn-pass').classList.remove('hidden');
      $('hint-text').textContent = 'Ekran bekleniyor…';
    }
  }
  requestAnimationFrame(tick);
}

// Hedefe yapılan tıklamayı yakala (oyunun kendi tıklaması da çalışır)
function onAppClick(e) {
  if (!running || !cur || cur.mode !== 'click' || !el) return;
  if (el.contains(e.target)) {
    ring.classList.remove('flash'); void ring.offsetWidth; ring.classList.add('flash');
    advance(cur.delay || 450);
    return;
  }
  // Dokunuş parlayan alanın içinde ama hedefin önünde başka bir öğe var
  // (dar ekranda paneller üst üste binebiliyor): tıklamayı hedefe yönlendir.
  const r = el.getBoundingClientRect();
  if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
    e.preventDefault(); e.stopPropagation();
    const target = el;
    ring.classList.remove('flash'); void ring.offsetWidth; ring.classList.add('flash');
    advance(cur.delay || 450);
    setTimeout(() => target.click(), 0);
  }
}

function nudge() {
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  if (el) { ring.classList.remove('flash'); void ring.offsetWidth; ring.classList.add('flash'); }
}
document.querySelectorAll('.shade').forEach(s => s.addEventListener('click', nudge));
ring.addEventListener('click', nudge);

$('btn-next').addEventListener('click', () => advance(0));
$('btn-pass').addEventListener('click', () => {
  log(`Adım ${idx + 1} geçildi (fallback)`);
  try { if (cur.fallback) cur.fallback(); } catch (e) {}
  advance(cur.fallback ? 500 : 0);
});
$('skip').addEventListener('click', () => {
  if (!running) { hideAll(); return; }
  if (!confirm("Tutorial'ı atlamak istiyor musun?")) return;
  if (cur && cur.leave) cur.leave();
  stop();
  restoreApp();
});

function hideAll() {
  layer.classList.remove('on');
  card.classList.remove('show');
  place(null);
  $('sh-top').style.width = '0px';
}

function stop() {
  running = false; cur = null; idx = -1;
  hideAll();
}

function finish() {
  if (cur && cur.leave) cur.leave();
  stop();
  try { localStorage.setItem('vettex-tutorial-done', '1'); } catch (e) {}
  $('finish').classList.add('show');
  log('Tutorial tamamlandı');
}

$('btn-enter').addEventListener('click', () => {
  $('finish').classList.remove('show');
  ev(`if (typeof closeResultScreen === 'function') closeResultScreen(); closeModal(); if (typeof backToMainMenu === 'function') backToMainMenu();`);
  restoreApp();
});
$('btn-replay').addEventListener('click', () => { location.reload(); });

// ═══════════════════════════════════════════════════════════════
// BAŞLATMA
// Splash bitsin, vaka verisi ve soru havuzu yüklensin, kayıt formu
// doldurulmuşsa tutorial başlar.
// ═══════════════════════════════════════════════════════════════
function appState() {
  const doc = D(); if (!doc || !doc.body) return 'loading';
  const splash = doc.getElementById('splash');
  const splashGone = !splash || !splash.isConnected || W().getComputedStyle(splash).display === 'none' || parseFloat(W().getComputedStyle(splash).opacity) < 0.05;
  const dataOk = ev(`typeof CASE_DATA !== 'undefined' && !!CASE_DATA[${JSON.stringify(TUT_CASE)}] && typeof DISEASE_LIBRARY !== 'undefined' && !!window.QUESTIONS && Object.keys(window.QUESTIONS).length > 0`);
  if (!splashGone || !dataOk) return 'loading';
  if (doc.getElementById('reg-overlay')?.classList.contains('open')) return 'register';
  return 'ready';
}

function waitForApp() {
  card.classList.add('show');
  $('chapter').textContent = 'Hazırlanıyor';
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    let s;
    try { s = appState(); } catch (e) {
      clearInterval(timer);
      $('text').innerHTML = 'Tutorial oyuna bağlanamadı. Sayfa ile oyun aynı adresten açılmalı (dosyayı doğrudan açmak yerine bir sunucu veya uygulama içinden aç).';
      console.error('[VettexTutorial] iframe erişim hatası:', e);
      return;
    }
    if (s === 'register') {
      layer.classList.remove('on');
      $('text').innerHTML = 'Önce kayıt formunu doldur, tutorial ardından başlayacak.';
      card.classList.remove('at-bottom'); card.classList.add('at-top');
      return;
    }
    if (s === 'loading') {
      $('text').textContent = tries > 80 ? 'Vaka verisi hâlâ yükleniyor. İnternet bağlantını kontrol et.' : 'Klinik hazırlanıyor…';
      return;
    }
    clearInterval(timer);
    D().addEventListener('click', onAppClick, true);
    prepareApp();
    layer.classList.add('on');
    running = true;
    setTimeout(() => go(0), 300);
  }, 250);
}

frame.addEventListener('load', () => { log('Oyun yüklendi'); waitForApp(); });
window.addEventListener('resize', () => { scrolledEl = null; });
requestAnimationFrame(tick);
</script>
