<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vettex Tutorial</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { overflow: hidden; background: #0a0e1a; width: 100vw; height: 100vh; }

#app-frame {
  position: fixed; inset: 0; width: 100%; height: 100%;
  border: none; z-index: 1; pointer-events: none;
}
#app-frame.interactive { pointer-events: auto; }

/* Spotlight */
#spotlight-box {
  position: fixed; border-radius: 12px;
  box-shadow: 0 0 0 3px rgba(0,212,255,0.85), 0 0 0 9999px rgba(0,0,0,0.78);
  z-index: 100; pointer-events: none;
  transition: all 0.5s cubic-bezier(.4,0,.2,1);
  opacity: 0;
}
#spotlight-box.visible { opacity: 1; }
#spotlight-box.pulse { animation: sp-pulse 1.3s ease-in-out infinite; }
@keyframes sp-pulse {
  0%,100% { box-shadow: 0 0 0 3px rgba(0,212,255,0.6), 0 0 0 9999px rgba(0,0,0,0.78); }
  50%      { box-shadow: 0 0 0 6px rgba(0,212,255,1), 0 0 28px rgba(0,212,255,0.4), 0 0 0 9999px rgba(0,0,0,0.78); }
}

/* Tooltip */
#tut-tip {
  position: fixed; z-index: 200;
  background: #0b1220;
  border: 1px solid rgba(0,212,255,0.4);
  border-radius: 16px;
  padding: 18px 20px 14px;
  width: min(340px, 94vw);
  box-shadow: 0 20px 60px rgba(0,0,0,0.85), 0 0 40px rgba(0,212,255,0.05);
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: auto;
}
#tut-tip.visible { opacity: 1; transform: translateY(0); }

.tip-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 2px;
  color: rgba(0,212,255,0.55); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.tip-badge::after { content:''; flex:1; height:1px; background: rgba(0,212,255,0.12); }

.tip-body {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; line-height: 1.9;
  color: #c0d4ef; margin-bottom: 14px;
}
.tip-body strong { color: #00d4ff; }
.tip-body em { color: #f39c12; font-style: normal; }

.tip-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.tip-skip {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: rgba(100,130,170,0.4); background: none; border: none;
  cursor: pointer; padding: 4px 0; letter-spacing: 1px; transition: color 0.2s;
}
.tip-skip:hover { color: rgba(100,130,170,0.85); }

.tip-next {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 1px; color: #00d4ff;
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.4);
  border-radius: 10px; padding: 9px 20px;
  cursor: pointer; transition: all 0.2s;
}
.tip-next:hover { background: rgba(0,212,255,0.18); }

.tip-pass {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: rgba(122,156,197,0.5);
  background: none;
  border: 1px solid rgba(122,156,197,0.2);
  border-radius: 8px; padding: 7px 14px;
  cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.tip-pass:hover { color: rgba(122,156,197,0.8); border-color: rgba(122,156,197,0.4); }

.tip-wait {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: #f39c12; letter-spacing: 1px;
  display: flex; align-items: center; gap: 6px;
  animation: blink-w 1s ease-in-out infinite;
}
@keyframes blink-w { 0%,100%{opacity:.35} 50%{opacity:1} }

/* Progress */
#tut-progress {
  position: fixed; top:0; left:0; right:0; height:2px;
  background: rgba(255,255,255,0.05); z-index: 300;
}
#tut-progress-fill {
  height:100%;
  background: linear-gradient(90deg,#00d4ff,#2ecc71);
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 8px rgba(0,212,255,0.5);
}

/* Dots */
#tut-dots {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 7px; z-index: 300;
}
.tut-dot { width:6px; height:6px; border-radius:50%; background: rgba(255,255,255,0.1); transition: all 0.3s; }
.tut-dot.active { background:#00d4ff; transform:scale(1.45); box-shadow:0 0 6px rgba(0,212,255,0.7); }
.tut-dot.done   { background: rgba(46,204,113,0.5); }

/* Tamamlama */
#tut-finish {
  position:fixed; inset:0; background:rgba(10,14,26,0.96);
  z-index:400; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:20px; text-align:center; padding:32px;
}
#tut-finish.show { display:flex; animation:fadeIn 0.5s ease; }
.fin-icon { font-size:50px; animation:bounceIn 0.6s 0.1s both; }
.fin-title { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; color:#00d4ff; letter-spacing:3px; }
.fin-sub { font-family:'JetBrains Mono',monospace; font-size:12px; color:rgba(122,156,197,0.8); line-height:1.9; max-width:300px; }
.fin-btn {
  font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:1px;
  padding:12px 28px; border-radius:12px; cursor:pointer; transition:all 0.2s; margin:4px;
  border:1px solid rgba(0,212,255,0.4); background:rgba(0,212,255,0.08); color:#00d4ff;
}
.fin-btn:hover { background:rgba(0,212,255,0.18); }
.fin-btn.primary { border-color:rgba(46,204,113,0.5); background:rgba(46,204,113,0.1); color:#2ecc71; }
.fin-btn.primary:hover { background:rgba(46,204,113,0.2); }

@keyframes fadeIn  { from{opacity:0} to{opacity:1} }
@keyframes bounceIn{ 0%{transform:scale(.3);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
</style>
</head>
<body>

<iframe id="app-frame" src="VetCaseClaudeKontrol.html"></iframe>
<div id="spotlight-box"></div>

<div id="tut-tip">
  <div class="tip-badge" id="tip-badge">ADIM 1 / 8</div>
  <div class="tip-body" id="tip-body"></div>
  <div class="tip-actions">
    <button class="tip-skip" onclick="skipTutorial()">Atla</button>
    <div id="tip-action-area"></div>
  </div>
</div>

<div id="tut-progress"><div id="tut-progress-fill" style="width:0%"></div></div>
<div id="tut-dots"></div>

<div id="tut-finish">
  <div class="fin-icon">🎉</div>
  <div class="fin-title">TUTORIAL TAMAMLANDI</div>
  <div class="fin-sub">Harika! Vettex'in tüm temel akışını gördün.<br>Şimdi kendi vakalarını çözmeye hazırsın!</div>
  <div>
    <button class="fin-btn primary" onclick="goToApp()">▶ KLİNİĞE GİR</button>
    <button class="fin-btn" onclick="replayTutorial()">↺ Tekrar İzle</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONSOLE LOG YARDIMCI
// ═══════════════════════════════════════════════════════════════
function tlog(msg, data) {
  const ts = new Date().toLocaleTimeString('tr-TR');
  if (data !== undefined) {
    console.log(`%c[VettexTutorial ${ts}] ${msg}`, 'color:#00d4ff;font-weight:bold', data);
  } else {
    console.log(`%c[VettexTutorial ${ts}] ${msg}`, 'color:#00d4ff;font-weight:bold');
  }
}

// ═══════════════════════════════════════════════════════════════
// ADIM TANIMI
// waitFor:
//   'none'  → Devam / Geç butonuyla
//   'click' → query: iframe CSS selector, kullanıcı tıklayınca
//   'fn'    → check(): true dönünce
// showPass: true → "Geç" butonu göster (opsiyonel atlama)
// ═══════════════════════════════════════════════════════════════
const STEPS = [

  // 0 ── AYARLAR (ana ekran açıldığında başlar)
  {
    badge: 'ADIM 1 / 8 — AYARLAR',
    html: `Sol üstteki <strong>⚙ Ayarlar</strong> sekmesini inceleyelim.<br><br>
🚨 <strong>Acil Vaka Modu</strong> — 5 eylem hakkıyla hızlı tanı zorunluluğu<br>
📱 <strong>Mobil Mod</strong> — telefon ekranı için optimize görünüm<br>
💰 <strong>Ekonomi Modu</strong> — hasta sahibi bütçesine göre test seçimi<br>
☀️ <strong>Aydınlık Mod</strong> — tema değişikliği<br><br>
<em>İstersen ayarlarla oyna, hazır olunca devam et.</em>`,
    spotlight: null, // Ayarlar sekmesini ilk açmak için
    waitFor: 'none',
    showPass: true,
    onEnter: () => {
      tlog('Adım 0: Ayarlar adımı başladı');
      // Ayarlar sekmesini otomatik aç
      try {
        const doc = getDoc();
        const tabs = doc.querySelectorAll('button.wm-tab');
        tlog('Adım 0: wm-tab butonları bulundu', tabs.length);
        // İkinci tab = Ayarlar
        if (tabs[1]) {
          tabs[1].click();
          tlog('Adım 0: Ayarlar sekmesi tıklandı');
          setTimeout(() => {
            spotlightQuery('button.wm-tab:nth-child(2)');
            positionTooltip(null);
          }, 200);
        }
      } catch(e) { tlog('Adım 0 HATA', e.message); }
    }
  },

  // 1 ── BAŞLAT
  {
    badge: 'ADIM 2 / 8 — BAŞLAT',
    html: `Harika! Şimdi <strong>▶ Başlat</strong> sekmesine tıkla.<br><br>
Klinik moda gireceğiz — bir kedi vakası seni bekliyor! 🐱`,
    spotlight: 'button.wm-tab:first-child',
    waitFor: 'click',
    waitQuery: 'button.wm-tab:first-child',
    onEnter: () => {
      tlog('Adım 1: Başlat tıklama bekleniyor');
      setTimeout(() => spotlightQuery('button.wm-tab:first-child'), 100);
    }
  },

  // 2 ── KLİNİK MOD
  {
    badge: 'ADIM 3 / 8 — KLİNİK MOD',
    html: `<strong>KLİNİK MOD</strong>'a tıkla! 🏥<br><br>
Klinik modda her işlem bir hak harcar — gerçek klinik baskısını hissedeceksin.`,
    spotlight: null,
    waitFor: 'fn',
    showPass: false,
    onEnter: () => {
      tlog('Adım 2: Klinik Mod bekleniyor');
      // Klinik mod kartını spotlight'la
      setTimeout(() => {
        try {
          const doc = getDoc();
          // "openClinicMode" onclick olan kart
          const cards = doc.querySelectorAll('.species-card');
          tlog('Adım 2: species-card sayısı', cards.length);
          cards.forEach((c,i) => tlog(`  card[${i}]`, c.textContent.trim().substring(0,40)));
          // KLİNİK MOD kartı — openClinicMode çağırıyor
          const klinik = Array.from(cards).find(c => c.getAttribute('onclick') && c.getAttribute('onclick').includes('openClinicMode'));
          if (klinik) { spotlightEl(klinik); tlog('Adım 2: KLİNİK MOD kartı spotlight'); }
          else { tlog('Adım 2: KLİNİK MOD kartı bulunamadı, tüm onclick listesi:');
            cards.forEach(c => tlog('  onclick:', c.getAttribute('onclick'))); }
        } catch(e) { tlog('Adım 2 HATA', e.message); }
      }, 300);
    },
    checkFn: () => {
      try {
        const doc = getDoc();
        // openClinicMode çağrılınca wm-mod-cards gizleniyor
        const cards = doc.getElementById('wm-mod-cards');
        const hidden = cards && cards.style.display === 'none';
        if (hidden) tlog('Adım 2: Klinik mod seçildi ✓');
        return hidden;
      } catch(e) { return false; }
    }
  },

  // 3 ── KARIŞ IK / RASTGELE VAKA
  {
    badge: 'ADIM 4 / 8 — VAKA SEÇİMİ',
    html: `Şimdi <strong>Karışık</strong>'a tıkla — rastgele bir vaka gelecek.<br><br>
<em>⚡ Tutorial için GIS Obstrüksiyon vakası yüklenecek.</em>`,
    spotlight: null,
    waitFor: 'fn',
    showPass: false,
    onEnter: () => {
      tlog('Adım 3: Vaka seçimi bekleniyor');
      setTimeout(() => {
        try {
          const doc = getDoc();
          // "welcome-clinic" görünür mü kontrol et
          const wc = doc.getElementById('welcome-clinic');
          tlog('Adım 3: welcome-clinic display', wc ? wc.style.display : 'bulunamadı');

          // Klinik seçim ekranındaki karışık butonu bul
          const allBtns = doc.querySelectorAll('[onclick*="startClinicMode"]');
          tlog('Adım 3: startClinicMode butonları', allBtns.length);
          allBtns.forEach((b,i) => tlog(`  btn[${i}] onclick:`, b.getAttribute('onclick'), '| text:', b.textContent.trim().substring(0,30)));

          // "any" olan buton = Karışık
          const karinik = Array.from(allBtns).find(b => b.getAttribute('onclick') && b.getAttribute('onclick').includes("'any'"));
          if (karinik) {
            spotlightEl(karinik);
            tlog('Adım 3: Karışık butonu spotlight');
          } else {
            // Fallback: tüm species-card listele
            const sc = doc.querySelectorAll('.species-card');
            tlog('Adım 3 fallback: species-card sayısı', sc.length);
            if (sc.length > 0) spotlightEl(sc[sc.length-1]);
          }
        } catch(e) { tlog('Adım 3 HATA', e.message); }
      }, 400);
    },
    checkFn: () => {
      try {
        const doc = getDoc();
        const win = doc.defaultView;
        const has = !!(win && win.currentCase);
        if (has) tlog('Adım 3: currentCase yüklendi ✓', win.currentCase?.diagnosis || win.currentCase?._realDiagnosis || '?');
        return has;
      } catch(e) { return false; }
    },
    // Vaka yüklendiğinde GIS obstrüksiyon'u zorla yükle
    onComplete: () => {
      tlog('Adım 3 tamamlandı: GIS obstrüksiyon vakasını zorla yüklüyorum...');
      setTimeout(() => forceGISCase(), 300);
    }
  },

  // 4 ── GENEL BİLGİLER (pasif, okusun)
  {
    badge: 'ADIM 5 / 8 — HASTA BİLGİLERİ',
    html: `Kliniğe <strong>bir kedi</strong> geldi! 🐈<br><br>
<em>Şikayet:</em> 3 gündür yemiyor, sürekli kusuyor — ama mide boş gibi, sadece sarı sıvı geliyor.<br><br>
Sol panelde genel bilgileri incele, hazır olunca devam et.`,
    spotlight: null,
    waitFor: 'none',
    showPass: true,
    onEnter: () => {
      tlog('Adım 4: Hasta bilgileri adımı');
      setTimeout(() => {
        try {
          const doc = getDoc();
          // Sol panel / patient card spotlight
          const panel = doc.querySelector('.patient-panel, .left-panel, #left-panel, .case-info, #case-info, [class*="patient"]');
          tlog('Adım 4: Sol panel', panel ? panel.className : 'bulunamadı');
          if (panel) spotlightEl(panel);
          else hideSpotlight();
        } catch(e) { tlog('Adım 4 HATA', e.message); }
      }, 300);
    }
  },

  // 5 ── ANAMNEZ
  {
    badge: 'ADIM 6 / 8 — ANAMNEZ',
    html: `Şimdi <strong>🔍 Anamnez Sor</strong> butonuna bas.<br><br>
<em>Genel → Davranış</em> kategorisini aç ve<br>
<strong>"Yabancı cisim yeme alışkanlığı var mı?"</strong><br>sorusunu sor.<br><br>
Cevabı görünce bir sonraki adıma geçebilirsin.`,
    spotlight: 'button[onclick="openAnamnezModal()"]',
    waitFor: 'fn',
    showPass: false,
    onEnter: () => {
      tlog('Adım 5: Anamnez adımı — davranis_5 bekleniyor');
      setTimeout(() => spotlightQuery('button[onclick="openAnamnezModal()"]'), 200);
    },
    checkFn: () => {
      try {
        const doc = getDoc();
        const win = doc.defaultView;
        const answered = !!(win && win._aqAnswered && win._aqAnswered['davranis_5']);
        if (answered) tlog('Adım 5: davranis_5 cevaplandı ✓', win._aqAnswered['davranis_5']);
        return answered;
      } catch(e) { return false; }
    }
  },

  // 6 ── RÖNTGEN
  {
    badge: 'ADIM 7 / 8 — RÖNTGEN',
    html: `GIS obstrüksiyon şüphesi var — röntgen zamanı! ☢️<br><br>
<strong>C. Görüntüleme</strong> sekmesine geç →<br>
<strong>Röntgen</strong> butonuna bas →<br>
<strong>İndirekt Röntgen</strong>'i seç.<br><br>
<em>Abdominal grafide ne görüyorsun?</em>`,
    spotlight: 'button[onclick="switchTab(\'goruntu\')"]',
    waitFor: 'fn',
    showPass: false,
    onEnter: () => {
      tlog('Adım 6: Röntgen adımı');
      setTimeout(() => spotlightQuery("button[onclick=\"switchTab('goruntu')\"]"), 200);
    },
    checkFn: () => {
      try {
        const doc = getDoc();
        const win = doc.defaultView;
        // _usedActions veya imaging yapıldı mı kontrol et
        const usedImaging = win && win._usedImaging && (win._usedImaging['xray_indirect'] || win._usedImaging['xray_direct']);
        // Alternatif: modal açık ve röntgen içeriyor
        const modal = doc.querySelector('#modal-overlay, .modal-overlay, #mod-overlay');
        const modalHasXray = modal && modal.style.display !== 'none' &&
          (modal.textContent||'').toLowerCase().match(/röntgen|indirekt|radyografi|xray/);
        // Alternatif 2: sonuç panelinde röntgen geçiyor
        const resultPanel = doc.querySelector('#result-panel, .result-area, #exam-results');
        const resultHasXray = resultPanel && (resultPanel.textContent||'').toLowerCase().match(/röntgen|indirekt|radyografi/);

        tlog('Adım 6 check: usedImaging=', usedImaging, '| modalXray=', !!modalHasXray, '| resultXray=', !!resultHasXray);
        return !!(usedImaging || modalHasXray || resultHasXray);
      } catch(e) { tlog('Adım 6 checkFn HATA', e.message); return false; }
    }
  },

  // 7 ── TEŞHİS
  {
    badge: 'ADIM 8 / 8 — TEŞHİS',
    html: `Son adım! 🎯<br><br>
<strong>🔍 Teşhis</strong> butonuna bas ve doğru tanıyı seç:<br><br>
<em>GIS Obstrüksiyon (Yabancı Cisim)</em><br><br>
Teşhis verdikten sonra tutorial tamamlanacak! 🏆`,
    spotlight: '#diag-btn, [onclick*="TEŞHİS"], [onclick*="showDiagnosisPanel"]',
    waitFor: 'fn',
    showPass: false,
    onEnter: () => {
      tlog('Adım 7: Teşhis adımı — diagnosisSubmitted bekleniyor');
      setTimeout(() => {
        spotlightQuery('#diag-btn');
        // diag-btn görünür mü?
        try {
          const doc = getDoc();
          const btn = doc.getElementById('diag-btn');
          tlog('Adım 7: diag-btn', btn ? `display:${btn.style.display}` : 'bulunamadı');
        } catch(e) {}
      }, 200);
    },
    checkFn: () => {
      try {
        const doc = getDoc();
        const win = doc.defaultView;
        const done = !!(win && win.diagnosisSubmitted);
        if (done) tlog('Adım 7: diagnosisSubmitted = true ✓');
        return done;
      } catch(e) { return false; }
    }
  },
];

// ═══════════════════════════════════════════════════════════════
// GIS OBSTRÜKSIYON ZORLA YÜKLEME
// Kullanıcı hangi vakayı seçerse seçsin, tutorial için GIS'i yükle
// ═══════════════════════════════════════════════════════════════
function forceGISCase() {
  try {
    const doc = getDoc();
    const win = doc.defaultView;
    if (!win) { tlog('forceGISCase: win yok'); return; }
    if (!win.CASE_DATA) { tlog('forceGISCase: CASE_DATA yok'); return; }

    const keys = Object.keys(win.CASE_DATA);
    tlog('forceGISCase: Tüm CASE_DATA keyleri', keys);

    // GIS / obstrüksiyon / Luna içeren key'i bul
    let gisKey = null;
    for (const k of keys) {
      const c = win.CASE_DATA[k];
      const diag = (c.diagnosis || c._realDiagnosis || '').toLowerCase();
      const name = (c.patientName || c.name || '').toLowerCase();
      tlog(`  key="${k}" | diagnosis="${diag}" | name="${name}"`);
      if (diag.includes('gis') || diag.includes('obstru') || name.includes('luna') || k.includes('001') || k.includes('gis')) {
        gisKey = k;
        tlog(`forceGISCase: GIS key bulundu → "${gisKey}"`);
        break;
      }
    }

    if (!gisKey) {
      tlog('forceGISCase: GIS key bulunamadı — mevcut vakayı bırakıyorum');
      return;
    }

    // startClinicMode mantığını taklit et ama GIS vakasını yükle
    if (win.randomizePatientMeta && win.startCase) {
      const randomized = win.randomizePatientMeta(gisKey);
      win.CASE_DATA['__clinic__'] = randomized;
      win.CASE_DATA['__clinic__']._clinicMode = true;
      win.CASE_DATA['__clinic__']._realDiagnosis = randomized.diagnosis || 'GIS Obstrüksiyon';
      win.CASE_DATA['__clinic__']._realKey = gisKey;
      win.startCase('__clinic__');
      tlog('forceGISCase: GIS vakası başarıyla yüklendi ✓');
    } else if (win.startCase) {
      win.startCase(gisKey);
      tlog('forceGISCase: startCase(gisKey) çağrıldı');
    } else {
      tlog('forceGISCase: startCase fonksiyonu bulunamadı!');
    }

  } catch(e) { tlog('forceGISCase HATA', e.message); }
}

// ═══════════════════════════════════════════════════════════════
// CORE
// ═══════════════════════════════════════════════════════════════
let currentStep = 0;
let waitInterval = null;
let waitClickCleanup = null;
let tutorialStarted = false;

function getDoc() {
  const f = document.getElementById('app-frame');
  return f.contentDocument || f.contentWindow.document;
}

function getIframeRect(el) {
  const frame = document.getElementById('app-frame');
  const fr = frame.getBoundingClientRect();
  const r  = el.getBoundingClientRect();
  return { left: fr.left + r.left, top: fr.top + r.top, width: r.width, height: r.height };
}

function spotlightEl(el) {
  if (!el) { hideSpotlight(); return; }
  const r = getIframeRect(el);
  if (!r || r.width === 0) { hideSpotlight(); return; }
  const pad = 8;
  const sp  = document.getElementById('spotlight-box');
  sp.style.left   = (r.left - pad) + 'px';
  sp.style.top    = (r.top  - pad) + 'px';
  sp.style.width  = (r.width  + pad*2) + 'px';
  sp.style.height = (r.height + pad*2) + 'px';
  sp.classList.add('visible', 'pulse');
}

function spotlightQuery(q) {
  if (!q) { hideSpotlight(); return; }
  try {
    const doc = getDoc();
    // birden fazla selector dene
    const selectors = q.split(',').map(s => s.trim());
    for (const sel of selectors) {
      const el = doc.querySelector(sel);
      if (el) { tlog('spotlight bulundu: ' + sel); spotlightEl(el); return; }
    }
    tlog('spotlight bulunamadı: ' + q);
    hideSpotlight();
  } catch(e) { hideSpotlight(); }
}

function hideSpotlight() {
  const sp = document.getElementById('spotlight-box');
  sp.classList.remove('visible', 'pulse');
}

function positionTooltip(spotQ) {
  const tip = document.getElementById('tut-tip');
  const W = window.innerWidth, H = window.innerHeight;
  const tw = tip.offsetWidth, th = tip.offsetHeight;

  if (!spotQ) {
    tip.style.left = Math.max(8, (W - tw) / 2) + 'px';
    tip.style.top  = Math.max(8, (H - th) / 2) + 'px';
    return;
  }
  try {
    const doc = getDoc();
    const selectors = spotQ.split(',').map(s=>s.trim());
    let el = null;
    for (const s of selectors) { el = doc.querySelector(s); if (el) break; }
    if (!el) { positionTooltip(null); return; }
    const r   = getIframeRect(el);
    const pad = 16;
    let top  = r.top + r.height + pad;
    let left = r.left;
    if (top + th > H - 50) top = r.top - th - pad;
    if (top < 8) top = 8;
    if (left + tw > W - 8) left = W - tw - 8;
    if (left < 8) left = 8;
    tip.style.top  = top + 'px';
    tip.style.left = left + 'px';
  } catch(e) { positionTooltip(null); }
}

function renderStep(idx) {
  tlog(`renderStep(${idx})`);
  clearWait();
  const s = STEPS[idx];

  document.getElementById('tip-badge').textContent = s.badge;
  document.getElementById('tip-body').innerHTML    = s.html;

  // Aksiyon alanı
  const area = document.getElementById('tip-action-area');
  if (s.waitFor === 'none') {
    let html = `<button class="tip-next" onclick="nextStep()">Devam ›</button>`;
    if (s.showPass) {
      html = `<button class="tip-pass" onclick="nextStep()">Geç</button>` + html;
    }
    area.innerHTML = html;
  } else {
    let html = `<span class="tip-wait">⏳ Aksiyonu bekliyor...</span>`;
    if (s.showPass) html += ` <button class="tip-pass" onclick="forceNext()" style="margin-left:8px">Geç</button>`;
    area.innerHTML = html;
  }

  // Progress & dots
  document.getElementById('tut-progress-fill').style.width = ((idx+1)/STEPS.length*100) + '%';
  const dots = document.getElementById('tut-dots');
  dots.innerHTML = STEPS.map((_,i) =>
    `<div class="tut-dot ${i<idx?'done':i===idx?'active':''}"></div>`
  ).join('');

  // Tooltip göster
  const tip = document.getElementById('tut-tip');
  tip.classList.add('visible');

  // onEnter hook
  if (s.onEnter) s.onEnter();

  // Spotlight & pozisyon (kısa gecikmeyle)
  setTimeout(() => {
    if (s.spotlight) {
      spotlightQuery(s.spotlight);
      positionTooltip(s.spotlight);
    } else {
      hideSpotlight();
      positionTooltip(null);
    }
  }, 200);

  // Bekleme kur
  setupWait(s, idx);
}

function setupWait(s, idx) {
  if (s.waitFor === 'none') return;
  enableIframe();

  if (s.waitFor === 'click' && s.waitQuery) {
    const attach = () => {
      try {
        const doc = getDoc();
        const el  = doc.querySelector(s.waitQuery);
        tlog(`setupWait click: query="${s.waitQuery}"`, el ? 'bulundu' : 'bulunamadı');
        if (!el) { setTimeout(attach, 500); return; }
        const handler = () => {
          tlog(`Tıklama algılandı: ${s.waitQuery}`);
          el.removeEventListener('click', handler);
          disableIframe();
          if (s.onComplete) s.onComplete();
          setTimeout(nextStep, 400);
        };
        el.addEventListener('click', handler);
        waitClickCleanup = () => el.removeEventListener('click', handler);
      } catch(e) { tlog('setupWait click HATA', e.message); }
    };
    setTimeout(attach, 600);
    return;
  }

  if (s.waitFor === 'fn' && s.checkFn) {
    waitInterval = setInterval(() => {
      try {
        if (s.checkFn()) {
          clearWait();
          disableIframe();
          if (s.onComplete) s.onComplete();
          setTimeout(nextStep, 500);
        }
      } catch(e) { tlog('waitInterval HATA', e.message); }
    }, 350);
  }
}

function clearWait() {
  if (waitInterval)    { clearInterval(waitInterval); waitInterval = null; }
  if (waitClickCleanup){ waitClickCleanup(); waitClickCleanup = null; }
}

function enableIframe()  { document.getElementById('app-frame').classList.add('interactive'); }
function disableIframe() { document.getElementById('app-frame').classList.remove('interactive'); }

function nextStep() {
  clearWait();
  disableIframe();
  const tip = document.getElementById('tut-tip');
  tip.classList.remove('visible');
  hideSpotlight();
  if (currentStep >= STEPS.length - 1) { setTimeout(finishTutorial, 350); return; }
  currentStep++;
  tlog('nextStep → ' + currentStep);
  setTimeout(() => renderStep(currentStep), 350);
}

// Geç butonu — zorla ilerle
function forceNext() {
  clearWait();
  disableIframe();
  tlog('forceNext: Adım zorla geçildi — ' + currentStep);
  nextStep();
}

function finishTutorial() {
  tlog('Tutorial tamamlandı!');
  document.getElementById('tut-dots').style.display = 'none';
  document.getElementById('tut-progress').style.display = 'none';
  document.getElementById('tut-finish').classList.add('show');
  enableIframe();
}

function skipTutorial() {
  if (!confirm('Tutorialı atlamak istiyor musun?')) return;
  tlog('Tutorial atlandı');
  clearWait();
  enableIframe();
  hideSpotlight();
  document.getElementById('tut-tip').classList.remove('visible');
  document.getElementById('tut-dots').style.display = 'none';
  document.getElementById('tut-progress').style.display = 'none';
}

function goToApp()      { document.getElementById('tut-finish').classList.remove('show'); }
function replayTutorial() {
  document.getElementById('tut-finish').classList.remove('show');
  document.getElementById('tut-dots').style.display = 'flex';
  document.getElementById('tut-progress').style.display = 'block';
  disableIframe();
  currentStep = 0;
  document.getElementById('tut-tip').classList.remove('visible');
  setTimeout(() => renderStep(0), 200);
}

// ═══════════════════════════════════════════════════════════════
// IFRAME YÜKLEME — ANA EKRAN AÇILINCA BAŞLAT (splash değil)
// ═══════════════════════════════════════════════════════════════
document.getElementById('app-frame').addEventListener('load', () => {
  tlog('iframe load event tetiklendi');

  // Splash geçene kadar bekle — wm-tab butonları görünür olunca başlat
  let attempts = 0;
  const waitForMainScreen = setInterval(() => {
    attempts++;
    try {
      const doc = getDoc();
      // Splash kaldırıldı mı? (splash elemanı yok veya gizlendi)
      const splash = doc.getElementById('splash');
      const splashGone = !splash || splash.style.display === 'none' || splash.style.opacity === '0' || !doc.body.contains(splash);
      // wm-tab butonları var mı?
      const tabs = doc.querySelectorAll('button.wm-tab');

      tlog(`waitForMainScreen denemesi ${attempts}: splashGone=${splashGone}, tabs=${tabs.length}`);

      if (splashGone && tabs.length >= 2 && !tutorialStarted) {
        clearInterval(waitForMainScreen);
        tutorialStarted = true;
        tlog('Ana ekran hazır — tutorial başlıyor!');
        setTimeout(() => renderStep(0), 800);
      }

      if (attempts > 60) { // 15 sn sonra zorla başlat
        clearInterval(waitForMainScreen);
        if (!tutorialStarted) {
          tutorialStarted = true;
          tlog('Zaman aşımı — tutorial zorla başlatılıyor');
          setTimeout(() => renderStep(0), 500);
        }
      }
    } catch(e) { tlog('waitForMainScreen HATA', e.message); }
  }, 250);
});

window.addEventListener('resize', () => {
  if (currentStep < STEPS.length && tutorialStarted) {
    const s = STEPS[currentStep];
    if (s.spotlight) { spotlightQuery(s.spotlight); positionTooltip(s.spotlight); }
    else positionTooltip(null);
  }
});
</script>
