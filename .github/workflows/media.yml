# VetTEX — Görselleri ve sesleri Supabase'e taşı
# Actions sekmesi → "Medyayı Supabase'e taşı" → Run workflow.
# Ne yapar:
#   1) Vaka dosyalarındaki ve oyundaki tüm görsel/ses adreslerini bulur (ibb, Wikimedia, GitHub, eski Supabase…)
#   2) Her birini indirir, yeni Supabase projesindeki "media" deposuna yükler
#   3) Dosyalardaki adresleri Supabase adresleriyle değiştirip repoya kaydeder
#   4) Vakaları Supabase'deki "cases" tablosuna yükler
# Birden fazla çalıştırmak güvenlidir: taşınmış adresler tekrar taşınmaz.
# Gerekli gizli değer: SUPABASE_SECRET_KEY (yeni projenin sb_secret_… anahtarı)

name: Medyayı Supabase'e taşı

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: https://kqixpnxswlpdkfyzshyu.supabase.co
  BUCKET: media
  FREE_CASES: "cat,fip,parvo"

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Medyayı taşı
        env:
          SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SB_KEY" ]; then echo "::error::SUPABASE_SECRET_KEY eksik (Settings → Secrets and variables → Actions)"; exit 1; fi
          python3 - <<'PY'
          import os, re, glob, hashlib, json, urllib.request, urllib.parse, urllib.error, mimetypes

          SB, KEY, BUCKET = os.environ['SUPABASE_URL'], os.environ['SB_KEY'], os.environ['BUCKET']
          PUBLIC = f'{SB}/storage/v1/object/public/{BUCKET}/'
          RAW = 'https://raw.githubusercontent.com/ArdaGumush/Vettextasima/refs/heads/main/'
          UA = {'User-Agent': 'VetTEX-media/1.0 (vettex.app@gmail.com)'}
          media_re = re.compile(r'https?://[^\s"\'<>\\]+?\.(?:png|jpe?g|webp|gif|svg|mp3|ogg|wav|m4a)(?:\?[^\s"\'<>()\\]*)?', re.I)

          files = [f for f in glob.glob('*.json') + glob.glob('*.html')
                   if f not in ('package.json', 'package-lock.json') and os.path.getsize(f) > 0]
          texts = {f: open(f, encoding='utf-8').read() for f in files}
          urls = sorted({u for t in texts.values() for u in media_re.findall(t) if not u.startswith(PUBLIC)})
          print(f'{len(urls)} medya adresi bulundu, {len(files)} dosyada')

          def download(u):
              if u.startswith(RAW):
                  local = urllib.parse.unquote(u[len(RAW):])
                  if os.path.exists(local):
                      return open(local, 'rb').read()
              cands = [u]
              m = re.match(r'(https://upload\.wikimedia\.org/wikipedia/commons)/thumb/(\w/\w\w/[^/]+)/[^/]+$', u)
              if m: cands.append(f'{m.group(1)}/{m.group(2)}')      # küçültülmüş görsel inmezse orijinali
              last = None
              for c in cands:
                  for _ in range(3):
                      try:
                          with urllib.request.urlopen(urllib.request.Request(c, headers=UA), timeout=60) as r:
                              data = r.read()
                              if len(data) < 200: raise ValueError('boş yanıt')
                              return data
                      except Exception as e:
                          last = e
              raise last

          def upload(name, data):
              ctype = mimetypes.guess_type(name)[0] or 'application/octet-stream'
              req = urllib.request.Request(f'{SB}/storage/v1/object/{BUCKET}/{name}', data=data, method='POST',
                                           headers={'apikey': KEY, 'Content-Type': ctype, 'x-upsert': 'true', 'cache-control': '31536000'})
              try:
                  urllib.request.urlopen(req, timeout=120).read()
              except urllib.error.HTTPError as e:
                  if e.code in (400, 401, 403):
                      req.add_header('Authorization', 'Bearer ' + KEY)
                      urllib.request.urlopen(req, timeout=120).read()
                  else:
                      raise

          mapping, failed = {}, []
          for u in urls:
              ext = os.path.splitext(urllib.parse.urlparse(u).path)[1].lower() or '.bin'
              if ext == '.jpeg': ext = '.jpg'
              name = hashlib.md5(u.encode()).hexdigest()[:16] + ext
              try:
                  upload(name, download(u))
                  mapping[u] = PUBLIC + name
                  print('✓', u[:110])
              except Exception as e:
                  failed.append((u, str(e)[:120]))
                  print(f'::warning::Taşınamadı: {u} ({str(e)[:120]})')

          changed = []
          for f, t in texts.items():
              new = t
              for u, v in mapping.items():
                  new = new.replace(u, v)
              if new != t:
                  open(f, 'w', encoding='utf-8').write(new); changed.append(f)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as s:
              s.write(f'## Medya taşıma\n\n**{len(mapping)}/{len(urls)}** dosya Supabase\'e taşındı. Değişen dosyalar: {", ".join(changed) or "yok"}\n\n')
              if failed:
                  s.write('### Taşınamayanlar (elle yüklenmeli)\n\n| Adres | Hata |\n|---|---|\n')
                  for u, e in failed: s.write(f'| {u} | {e} |\n')
          print(f'Bitti: {len(mapping)}/{len(urls)} taşındı, {len(failed)} başarısız')
          PY

      - name: Değişiklikleri repoya kaydet
        run: |
          git config user.name "VetTEX bot"
          git config user.email "vettex.app@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Medya adresleri Supabase'e taşındı"
          git push

      - name: Vakaları Supabase'e yükle
        env:
          SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          free = set(os.environ['FREE_CASES'].split(','))
          rows = []
          for f in ('cases.json', 'cases2.json', 'cases3.json'):
              if os.path.exists(f) and os.path.getsize(f) > 0:
                  for k, v in json.load(open(f, encoding='utf-8')).items():
                      rows.append({'key': k, 'data': v, 'is_free': k in free})
          url = os.environ['SUPABASE_URL'] + '/rest/v1/cases?on_conflict=key'
          key = os.environ['SB_KEY']
          body = json.dumps(rows, ensure_ascii=False).encode('utf-8')
          h = {'apikey': key, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal'}
          def post(headers):
              with urllib.request.urlopen(urllib.request.Request(url, data=body, method='POST', headers=headers), timeout=90) as r:
                  return r.status
          try:
              st = post(h)
          except urllib.error.HTTPError as e:
              if e.code in (401, 403): st = post(dict(h, Authorization='Bearer ' + key))
              else: print('::error::', e.code, e.read().decode()[:500]); raise SystemExit(1)
          print(f'{len(rows)} vaka yüklendi ({sum(r["is_free"] for r in rows)} ücretsiz) — HTTP {st}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as s:
              s.write(f'## Vakalar\n\n{len(rows)} vaka Supabase\'e yüklendi.\n')
          PY
